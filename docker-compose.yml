services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gacha
      POSTGRES_PASSWORD: gacha
      POSTGRES_DB: gacha
    ports:
      - "5433:5432"
    volumes:
      - comic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gacha -d gacha"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://gacha:gacha@db:5432/gacha?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  comic-postgres-data:
